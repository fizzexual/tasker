<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tasker</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region="deep">
      <span class="brand"><i class="cursor" aria-hidden="true"></i>Tasker</span>
      <span class="win-btns">
        <button id="win-min" class="win-btn" tabindex="-1" title="Minimize" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" /></svg>
        </button>
        <button id="win-max" class="win-btn" tabindex="-1" title="Maximize" aria-label="Maximize" data-icon="max">
          <svg class="i-max" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5h9v9h-9z" /></svg>
          <svg class="i-restore" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5v-2h7v7h-2M0.5 2.5h7v7h-7z" /></svg>
        </button>
        <button id="win-close" class="win-btn close" tabindex="-1" title="Close" aria-label="Close">
          <svg class="i-close" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" /></svg>
        </button>
      </span>
    </div>
    <header class="topbar">
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" data-tab="processes" aria-selected="true">Processes</button>
        <button class="tab" role="tab" data-tab="performance" aria-selected="false">Performance</button>
        <button class="tab" role="tab" data-tab="users" aria-selected="false">Users</button>
        <button class="tab" role="tab" data-tab="startup" aria-selected="false">Startup apps</button>
        <button class="tab" role="tab" data-tab="services" aria-selected="false">Services</button>
      </nav>
      <button id="paused-chip" class="ghost paused" hidden title="The numbers are not refreshing. Click or press F5 to refresh now.">
        <span class="long">Paused · refresh</span><span class="short">Paused</span>
      </button>
      <div class="chips" aria-live="off">
        <span class="chip m-cpu" title="Processor: use and current speed"><span class="k">CPU</span><b id="chip-cpu">–</b><span class="more" id="chip-cpu-more"></span></span>
        <span class="chip m-mem" title="Memory: share in use, and how much of how much"><span class="k">Memory</span><b id="chip-mem">–</b><span class="more" id="chip-mem-more"></span></span>
        <span class="chip m-gpu wide1" hidden title="Graphics card (the busiest one): use, memory in use, temperature"><span class="k">GPU</span><b id="chip-gpu">–</b><span class="more" id="chip-gpu-more"></span></span>
        <span class="chip m-disk wide2" hidden title="The busiest disk: how busy it is, and how fast it is reading and writing"><span class="k" id="chip-disk-label">Disk</span><b id="chip-disk">–</b><span class="more" id="chip-disk-more"></span></span>
      </div>
      <button id="admin-btn" class="ghost" hidden title="Restart as administrator: needed to end system processes and control services">
        <span class="long">Restart as administrator</span><span class="short">As admin</span>
      </button>
      <span id="admin-badge" class="badge" hidden title="Running with administrator rights"><span class="long">Administrator</span><span class="short">Admin</span></span>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"
            transform="translate(-1 0)"
          />
        </svg>
      </button>
    </header>

    <main>
      <section id="tab-processes" class="panel" role="tabpanel"></section>
      <section id="tab-performance" class="panel" role="tabpanel" hidden></section>
      <section id="tab-users" class="panel" role="tabpanel" hidden></section>
      <section id="tab-startup" class="panel" role="tabpanel" hidden></section>
      <section id="tab-services" class="panel" role="tabpanel" hidden></section>
    </main>

    <div id="menu" class="menu" hidden role="menu"></div>
    <dialog id="settings" aria-label="Settings"></dialog>
    <dialog id="confirm" aria-label="Confirm"></dialog>
    <dialog id="modal"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
